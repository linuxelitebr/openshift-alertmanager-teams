# EXEMPLO. Nao commitar a versao preenchida.
# Criar assim, sem passar por arquivo:
#   oc -n <NAMESPACE> create secret generic teams-webhook-secrets \
#     --from-literal=tenant-id=... \
#     --from-literal=client-id=... \
#     --from-literal=client-secret=... \
#     --from-literal=redirect-uri=... \
#     --from-literal=team-id=... \
#     --from-literal=channel-id=... \
#     --from-literal=flask-secret-key="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: teams-webhook-secrets
  namespace: <NAMESPACE>
type: Opaque
stringData:
  tenant-id: "<ENTRA_TENANT_ID>"
  client-id: "<APP_CLIENT_ID>"
  client-secret: "<APP_CLIENT_SECRET>"
  redirect-uri: "<OAUTH_REDIRECT_URI>"
  team-id: "<TEAMS_TEAM_ID>"
  channel-id: "<TEAMS_CHANNEL_ID>"
  flask-secret-key: "<RANDOM_32_BYTES_HEX>"
